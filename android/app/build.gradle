plugins { id 'com.android.application' version '8.5.2' }
def cloudflareBuild = providers.gradleProperty('chatlinguaCloudflare').orElse('false').get().toBoolean()
def chatlinguaHost = cloudflareBuild
    ? 'chatlingua.pcarenza.workers.dev'
    : 'chatlingua-video-calls.goldencurl1.chatgpt.site'

android {
    buildFeatures { buildConfig true }
    namespace 'com.chatlingua.app'
    compileSdk 34
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId cloudflareBuild ? 'com.chatlingua.app.cloudflare' : 'com.chatlingua.app'
        buildConfigField 'String', 'CHATLINGUA_ORIGIN', '"' + 'https://' + chatlinguaHost + '"'
        manifestPlaceholders = [
            chatlinguaHost: chatlinguaHost,
            chatlinguaLabel: cloudflareBuild ? 'ChatLingua Cloudflare' : 'ChatLingua',
        ]
        minSdk 33
        targetSdk 34
        versionCode 3
        versionName '0.1.2'
    }
}
dependencies { implementation 'com.google.mlkit:translate:17.0.3' }
