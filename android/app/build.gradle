plugins {
    id 'com.android.application' version '8.5.2'
    id 'com.google.gms.google-services' version '4.4.2' apply false
}
def cloudflareBuild = providers.gradleProperty('chatlinguaCloudflare').orElse('true').get().toBoolean()
def chatlinguaHost = cloudflareBuild
    ? 'chatlingua.pcarenza.workers.dev'
    : 'chatlingua-video-calls.goldencurl1.chatgpt.site'

// Firebase is only configured for the Cloudflare package, and only when google-services.json is present.
if (cloudflareBuild && file('google-services.json').exists()) apply plugin: 'com.google.gms.google-services'

android {
    buildFeatures { buildConfig true }
    namespace 'com.chatlingua.app'
    compileSdk 34
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId cloudflareBuild ? 'com.chatlingua.app.cloudflare' : 'com.chatlingua.app'
        buildConfigField 'String', 'CHATLINGUA_ORIGIN', '"' + 'https://' + chatlinguaHost + '"'
        manifestPlaceholders = [
            chatlinguaHost: chatlinguaHost,
            chatlinguaLabel: cloudflareBuild ? 'ChatLingua Cloudflare' : 'ChatLingua',
            chatlinguaIcon: cloudflareBuild ? '@mipmap/ic_chatlingua_cloudflare' : '@android:drawable/sym_def_app_icon',
        ]
        if (providers.gradleProperty('chatlinguaArm64').orElse('false').get().toBoolean()) {
            ndk { abiFilters 'arm64-v8a' }
        }
        minSdk 33
        targetSdk 34
        versionCode cloudflareBuild ? 4 : 3
        versionName cloudflareBuild ? '0.1.3' : '0.1.2'
    }
}
dependencies {
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'androidx.core:core:1.9.0'
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging'
}
