plugins { id 'com.android.application' version '8.5.2' }
android {
    namespace 'com.chatlingua.app'
    compileSdk 34
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId 'com.chatlingua.app'
        minSdk 33
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }
}
dependencies { implementation 'com.google.mlkit:translate:17.0.3' }

